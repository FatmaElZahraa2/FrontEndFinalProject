<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecommerce Website</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="indexStyle.css">
</head>

<body>
    <header>
        <div class="TopHeader">
            <div class="HeaderContainer container d-flex justify-content-between align-items-center">
                <div class="HeaderContact">
                    <span>+971 (58) 135-9871</span>
                    <span>Our Location</span>
                </div>

                <p class="HeaderNews mb-0">Super Value Deals - Save More with coupons</p>

                <a href="#" class="HeaderLogin-Register">Log In / Register</a>
            </div>
        </div>


        <nav class="Navbar navbar navbar-expand-lg container">

            <a href="index.html" class="NavbarLogo navbar-brand">
                <img src="images/logo.svg" class="NavbarLogoImg" alt="Logo">
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#MainNavbar"
                aria-controls="MainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>


            <div class="NavbarMenu collapse navbar-collapse" id="MainNavbar">

                <ul class="NavbarList navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a href="#" class="NavbarItemLink nav-link active-Link">Home</a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="NavbarItemLink nav-link">Shop</a>
                    </li>

                    <li class="nav-item dropdown">
                        <a href="#" class="NavbarItemLink nav-link dropdown-toggle" role="button"
                            data-bs-toggle="dropdown">
                            Categories
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Men</a></li>
                            <li><a class="dropdown-item" href="#">Women</a></li>
                            <li><a class="dropdown-item" href="#">Kids</a></li>
                        </ul>
                    </li>

                    <li class="nav-item">
                        <a href="#" class="NavbarItemLink nav-link">My Account</a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="NavbarItemLink nav-link">Login</a>
                    </li>
                </ul>


                <div class="HeaderSearch">
                    <input type="text" class="SearchInput" placeholder="Search of items...">
                    <button class="HeaderSearchBtn">
                        <img src="images/search.png" alt="search">
                    </button>
                </div>


                <div class="NavbarSearchButtons d-flex">
                    <a href="#" class="NavbarBtns">
                        <img src="images/icon-heart.svg">
                        <span class="CountAddedItems">0</span>
                    </a>

                    <a href="#" class="NavbarBtns">
                        <img src="images/icon-cart.svg">
                        <span class="CountAddedItems">0</span>
                    </a>
                </div>

            </div>
        </nav>
    </header>

  

    <script src="indexScript.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>


</html>
