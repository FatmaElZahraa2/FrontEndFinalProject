<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://kit.fontawesome.com/eadda94817.js" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="ProduuctDetailsStyle.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sizebtn,
        .AddCartbtn:hover {
            border: solid .5px #00797a;
            background-color: white;
        }

        .sizebtn:hover,
        .HeatBtn:hover {
            background-color: #00797a;
            color: white;
        }

        .AddCartbtn {
            background-color: #00797a;
            color: white;
        }

        .RatingStars {
            color: #ebb40c;
        }
    </style>
</head>

<body>
    <header>
        <div class="TopHeader">
            <div class="HeaderContainer container d-flex justify-content-between align-items-center">
                <div class="HeaderContact">
                    <span>+971 (58) 135-9871</span>
                    <span>Our Location</span>
                </div>

                <p class="HeaderNews mb-0">Super Value Deals - Save More with coupons</p>

                <a href="#" class="HeaderLogin-Register">Log In / Register</a>
            </div>
        </div>


        <nav class="Navbar navbar navbar-expand-lg container">

            <a href="index.html" class="NavbarLogo navbar-brand">
                <img src="images/logo.svg" class="NavbarLogoImg" alt="Logo">
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#MainNavbar"
                aria-controls="MainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>


            <div class="NavbarMenu collapse navbar-collapse" id="MainNavbar">

                <ul class="NavbarList navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a href="#" class="NavbarItemLink nav-link active-Link">Home</a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="NavbarItemLink nav-link">Shop</a>
                    </li>

                    <li class="nav-item dropdown">
                        <a href="#" class="NavbarItemLink nav-link dropdown-toggle" role="button"
                            data-bs-toggle="dropdown">
                            Categories
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Men</a></li>
                            <li><a class="dropdown-item" href="#">Women</a></li>
                            <li><a class="dropdown-item" href="#">Kids</a></li>
                        </ul>
                    </li>

                    <li class="nav-item">
                        <a href="#" class="NavbarItemLink nav-link">My Account</a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="NavbarItemLink nav-link">Login</a>
                    </li>
                </ul>


                <div class="HeaderSearch">
                    <input type="text" class="SearchInput" placeholder="Search of items...">
                    <button class="HeaderSearchBtn">
                        <img src="images/search.png" alt="search">
                    </button>
                </div>


                <div class="NavbarSearchButtons d-flex">
                    <a href="#" class="NavbarBtns">
                        <img src="images/icon-heart.svg">
                        <span class="CountAddedItems">0</span>
                    </a>

                    <a href="#" class="NavbarBtns">
                        <img src="images/icon-cart.svg">
                        <span class="CountAddedItems">0</span>
                    </a>
                </div>

            </div>
        </nav>
    </header>

    <div class="bg-light py-3 border-bottom">

        <div class="container">
            <nav style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item">
                        <a href="index.html" class="text-decoration-none text-secondary">Home</a>
                    </li>
                    <li class="breadcrumb-item active" aria-current="page">Shop</li>
                </ol>
            </nav>
        </div>

    </div>

    <section class="container ">

        <div class="row mt-5" id="Productwrapper">

        </div>

    </section>
    <script>


        async function ShowProductDetails() {

            try {
                const productID = 1
                const APIresponse = await fetch(`https://dummyjson.com/products/${productID}`)
                const product = await APIresponse.json();
                console.log(product)
                const wrapper = document.getElementById('Productwrapper')
                const rate = Math.round(product.rating);
                let starinHtml = ""
                for (let i = 1; i <= 5; i++) {
                    if (i <= rate) {
                        starinHtml += '<i class="fa-solid fa-star RatingStars"></i>'; // نجمة ملونة
                    } else {
                        starinHtml += '<i class="fa-regular fa-star RatingStars" style="color: #ddd;"></i>'; // نجمة فارغة
                    }
                }
                wrapper.innerHTML = `

            

            <div class="col-lg-6 col-md-6 col-12 mb-4">
                <div class="bg-light p-4 text-center" style="border-radius:30px;">
                    <img style="max-height:450px; object-fit: contain;" class="img-fluid w-100" src="${product.thumbnail}" alt="${product.title}">
                </div>
            </div>

            <div class="col-lg-6 col-md-4 col-12 my-5">

                <h2>${product.title}</h2>
                <div class="mb-3 d-flex align-items-center">
                    <div class="me-2">${starinHtml}</div>
                    <span class="text-secondary small">(${product.rating} Rating)</span>
                </div>

                <p>Brands: <span style="color: #00797a;">${product.brand}</span></p>
                <hr>
                <div class="price-section mb-3">
                    <span class="fs-3 fw-bold" style="color: #00797a;">$${product.price}</span>
                    <span class="text-muted text-decoration-line-through ms-3">$${(product.price / (1 - product.discountPercentage/100)).toFixed(2)}</span>
                    <span class="badge bg-danger ms-2">${product.discountPercentage}% OFF</span>
                </>
                <hr>
                <p style="color: #707979;">${product.description}</p>

                <ul class="list-unstyled mb-4" style="color: #707979;">

                    <li><i class="fa-solid fa-repeat "></i> ${product.returnPolicy}</li>
                    <li><i class="fa-solid fa-credit-card"></i> Cash on Delivery available</li>
                </ul>
                <div class="Size-Buttons row mb-4 d-flex align-items-center">
                    <strong class="col-1 fs-5 fw-medium">Size</strong><br>
                    <div class="col-11 ">
                        <button class="sizebtn ">M</button>
                        <button class="sizebtn ">L</button>
                        <button class="sizebtn ">XL</button>
                        <button class="sizebtn ">XXL</button>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <input type="number" class="form-control w-25" value="1" min="1">
                    <button class="AddCartbtn btn px-4">Add to Cart</button>
                    <button class="HeatBtn btn btn-ou"><i class="fa-regular fa-heart"></i></button>
                </div>
            </div>
                 
                 `



            } catch (err) {
                console.error("Error fetching product:", err);
                document.getElementById('Productwrapper').innerHTML = `<p class="text-danger text-center">Failed to load product details.</p>`;
            }

        }

        ShowProductDetails()

    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
